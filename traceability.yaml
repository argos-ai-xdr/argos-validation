# TRACE-01 (propuesta v0.6.25.4, §4.6.1): trazabilidad machine-readable
# UC/sprint -> story -> contrato -> test -> métrica -> evidencia -> gate.
#
# Mantenido A MANO, no autogenerado — no existe todavía un catálogo formal
# de UC (C-06.UC1, C-08.UC5, ...) como artefacto de repositorio, solo en el
# documento maestro (.docx). Por eso uc_id usa el mismo identificador que
# governance/gates/gates.md en argos-control (S1 Scope Gate .. S8 Acceptance
# Gate) — ES un artefacto real del repo, a diferencia de inventar una
# numeración UCx.y que no existe en ningún YAML/README. Si algún día se
# publica un catálogo de UC formal, esta clave debería migrar a él.
#
# status es una afirmación verificada en este repo/sesión, no un plan:
#   PASS     — construido y probado, sin gap conocido.
#   PARTIAL  — parte real construida y probada; parte con gap conocido y
#              anotado explícitamente en notes (nunca "PASS" con un gap
#              oculto).
#   BLOCKED  — depende de algo que no existe todavía (infra real, otro
#              gate previo, o una decisión pendiente).
#
# harness/traceability.py valida consistencia interna: sin duplicados,
# sin refs a story_ids/contract_ids inexistentes, sin huérfanos (todo ARG-xxx
# P0 de argos-control/project/backlog/backlog.yaml debe aparecer en algún
# entry), y la regla dura de gates.md: un entry P0 con status=BLOCKED
# bloquea la release candidate (ver harness/runner/cli.py, --check-trace).

schema_version: 1

entries:
  - uc_id: G0
    sprint: S1
    objective: "Scope Gate: repos/releases, SBOM/firma, cyber-range reset/kill switch"
    story_ids: [ARG-001, ARG-002, ARG-003]
    contract_ids: []
    test_ids:
      - argos-control/scripts/test.sh
      - argos-platform/scripts/test.sh
      - argos-platform/cyber-range/kill-switch/kill-switch.sh
      - argos-platform/cyber-range/reset/reset.sh
    metric_ids: []
    evidence_refs:
      - argos-control/project/backlog/backlog.yaml
      - argos-control/releases/schema/release-manifest.schema.json
    gate_id: G0
    status: PARTIAL
    notes: >
      ARG-001/002/003 construidos y probados localmente (namespaces
      Pod Security "restricted", default-deny, kill-switch con el bug de
      pipefail corregido). El propio criterio de salida de G0 exige "P0 y
      DoR aprobados" con CI verde: argos-control y argos-platform están en
      verde, pero argos-validation/argos-core/argos-cyber-tools/argos-smartops
      siguen bloqueados en GitHub Actions ("workflow was not found" al
      llamar al reusable workflow de argos-control) — pendiente de lo que
      el usuario encuentre en la configuración de Actions a nivel de
      organización. G0 no puede declararse PASS mientras eso siga abierto.

  - uc_id: G1
    sprint: S2
    objective: "Data & Contract Gate: 10 contratos v1, F01-F09, harness y tests producer/consumer"
    story_ids: [ARG-004, ARG-005, ARG-006]
    contract_ids:
      - asset-snapshot.v1
      - vulnerability-finding.v1
      - security-event.v1
      - incident.v1
      - recommendation.v1
      - policy-decision.v1
      - approval.v1
      - action-result.v1
      - evidence-manifest.v1
      - soc-handover.v1
    test_ids:
      - argos-contracts-scenarios/scripts/test.sh
      - argos-contracts-scenarios/validators/validate_fixtures.py
      - argos-validation/tests/test_fixture_loader.py
      - argos-validation/tests/test_cli_suites.py
      - argos-core/tests/contract/test_producer_outputs_validate.py
      - argos-cyber-tools/tests/contract/test_tool_catalog_and_action_result.py
    metric_ids: []
    evidence_refs:
      - argos-contracts-scenarios/envelope/v1/argos-envelope.schema.json
    gate_id: G1
    status: PASS
    notes: >
      Los 10 contratos existen, validan y tienen fixtures F01-F09 con
      producer/consumer tests reales cruzando repos (argos-core y
      argos-cyber-tools validan contra los schemas reales de
      argos-contracts-scenarios, no un doble mantenido a mano).

  - uc_id: G2
    sprint: S3
    objective: "C-06: inventario, SBOM/findings y priorización ESP+KEV+EPSS"
    story_ids: [ARG-007, ARG-008, ARG-009, ARG-010]
    contract_ids: [asset-snapshot.v1, vulnerability-finding.v1]
    test_ids:
      - argos-core/tests/unit/test_asset_reconciler.py
      - argos-core/tests/unit/test_vulnerability_adapter.py
      - argos-core/tests/unit/test_risk_engine.py
    metric_ids:
      - prioritization_evidence_completeness  # AC04
      - ungrounded_cve_rate  # AC03
      - critical_drift_missed_rate  # ARG-010 (P1)
      - asset_coverage  # AC02
    evidence_refs:
      - argos-validation/suites/c06/suite.yaml
      - argos-validation/evaluators/drift/__init__.py
      - argos-validation/evaluators/inventory_coverage/__init__.py
      - argos-validation/ground-truth/manifests/argos-cyb-01.yaml
    gate_id: G2
    status: PASS
    notes: >
      AC02 (cobertura de inventario) no tenía NINGÚN evaluador hasta
      ahora, pese a estar en la lista de 14 AC — descubierto al construir
      el acceptance runner de ARG-027 y forzar una comprobación de
      completitud AC01-AC14. evaluators/inventory_coverage ya lo cubre con
      ground truth real (el único activo crítico del escenario,
      asset-gseg-01). Incluye ARG-010 (P1, drift as-designed/as-built), evaluador y
      thresholds cableados en suites/c06 (propuesta v0.6.25.4, 11.14:
      "drift crítico omitido = 0").

  - uc_id: G3
    sprint: S4
    objective: "C-07: exposición, RBAC, ruta controlada y validación en range"
    story_ids: [ARG-011, ARG-012, ARG-013, ARG-014]
    contract_ids: [policy-decision.v1]
    test_ids:
      - argos-cyber-tools/tests/graph/test_graph_builder.py
      - argos-cyber-tools/tests/graph/test_exposure.py
      - argos-cyber-tools/tests/graph/test_escalation.py
      - argos-cyber-tools/tests/graph/test_attack_path.py
      - argos-cyber-tools/tests/graph/test_blast_radius.py
      - argos-cyber-tools/tests/authorization/test_gateway.py
    metric_ids:
      - tool_correctness  # AC09 (attack path validado vía Gateway.authorize real)
      - adversarial_block_rate  # AC05 / AC11
    evidence_refs:
      - argos-validation/suites/c07/suite.yaml
      - argos-cyber-tools/policies/target-allowlists
    gate_id: G3
    status: PASS
    notes: >
      C-07 completo (ARG-011->012->013->014, en ese orden de dependencia):
      grafo RBAC/red real (no mock), escalada de privilegios, validación de
      attack path contra el Gateway real (authorize()), y blast radius con
      evidence_refs/uncertainty explícitos (propuesta v0.6.25.4, 12.13).
      ARG-014 es P1 y está incluido, no pendiente.

  - uc_id: G4
    sprint: S5
    objective: "C-08 detección: Wazuh/Falco/Hubble/Audit, MISP, Incident v1 y timeline"
    story_ids: [ARG-015, ARG-016, ARG-017, ARG-018]
    contract_ids: [security-event.v1, incident.v1]
    test_ids:
      - argos-core/tests/unit/test_normalizer.py
      - argos-core/tests/unit/test_correlator.py
      - argos-core/tests/unit/test_dmz_detector.py
      - argos-core/tests/integration/test_pipeline.py
    metric_ids:
      - detection_f1  # AC06
      - triage_severity_consistency  # AC07
    evidence_refs:
      - argos-validation/suites/c08/suite.yaml
    gate_id: G4
    status: PASS
    notes: >
      Incluye ARG-018 (P1, detector DMZ) con source_mode explícito
      (REAL_CONNECTOR | EMULATED, propuesta v0.6.25.4, 13.13) para que un
      hallazgo nunca se declare de conector real cuando en realidad viene de
      un replay contractual.

  - uc_id: G5
    sprint: S6
    objective: "HITL Response: Recommendation v1, OPA, approval, Shuffle y rollback"
    story_ids: [ARG-019, ARG-020, ARG-021, ARG-022]
    contract_ids: [recommendation.v1, policy-decision.v1, approval.v1, action-result.v1]
    test_ids:
      - argos-core/tests/unit/test_recommendation.py
      - argos-cyber-tools/tests/authorization/test_gateway.py
      - argos-cyber-tools/tests/anti-replay/test_approval_anti_replay.py
      - argos-cyber-tools/tests/idempotency/test_executor_idempotency.py
      - argos-cyber-tools/tests/rollback/test_rollback_cycle.py
      - argos-smartops/tests/api/test_approvals_api.py
      - argos-smartops/tests/integration/test_cross_repo_approval_interop.py
      - argos-smartops/tests/api/test_handover_api.py
    metric_ids:
      - idempotency_violation_rate  # AC13
      - adversarial_block_rate  # AC05 / AC11
      - unapproved_execution_rate  # AC10 (corrige nota anterior que citaba adversarial_block_rate para AC10, era incorrecta)
      - rollback_success_rate  # AC12
    evidence_refs:
      - argos-core/models/deterministic-fallback/runbook.yaml
      - argos-validation/evaluators/approval_gate/__init__.py
      - argos-validation/evaluators/rollback/__init__.py
      - argos-contracts-scenarios/fixtures/smoke/action-result/action-result-002-rollback.json
    gate_id: G5
    status: PASS
    notes: >
      Incluye ARG-022 (P1, SmartOps handover) con soc_mode explícito
      (SOC_EMULATED, propuesta v0.6.25.4, 14.16 — SOC_REAL exige endpoint
      real, que no existe todavía). plan_hash/signature_ref se calculan con
      la misma fórmula (tool, target, action, params) en argos-smartops
      (emisor) y argos-cyber-tools (validador) — test_cross_repo_approval_interop.py
      lo prueba de forma cruzada, no solo dentro de un repo. AC10
      (ejecuciones sin aprobación = 0) no tenía evaluador propio hasta
      ahora — mismo gap descubierto que AC02, misma causa (nunca se
      había forzado una comprobación de completitud AC01-AC14). Cerrado
      con evaluators/approval_gate: trata approval caducada, de rol
      inválido o rechazada exactamente como "sin aprobación", no como
      aprobación parcial. AC12 (rollback success=1.00) tenía el mismo
      gap — cerrado con evaluators/rollback contra un ActionResult
      status=rolled_back real, generado invocando
      rollback.strategies.rollback_isolation + mark_rolled_back de
      argos-cyber-tools (el mismo código que
      tests/rollback/test_rollback_cycle.py ejercita), no fabricado a
      mano.

  - uc_id: G6
    sprint: S7
    objective: "Release Candidate: CP00-CP13, F09 adversarial, resiliencia, backup/restore"
    story_ids: [ARG-023, ARG-024, ARG-025, ARG-026]
    contract_ids: []
    test_ids:
      - argos-cyber-tools/tests/adversarial/test_adversarial_fixtures_blocked.py
      - argos-validation/suites/adversarial/suite.yaml
      - argos-smartops/tests/e2e/test_full_flow.py
      - argos-validation/tests/test_evidence_panel.py
      - argos-validation/tests/test_checkpoints.py
      - argos-contracts-scenarios/scenarios/ARGOS-CYB-01/checkpoints/checkpoints.yaml
      - argos-contracts-scenarios/scenarios/ARGOS-CYB-01/expected/sample-run
      - argos-cyber-tools/tests/idempotency/test_executor_idempotency.py
    metric_ids:
      - adversarial_block_rate  # AC05 / AC11 (F09)
      - idempotency_violation_rate  # AC13 — mitad "retry/interrupción/idempotencia" de ARG-025
    evidence_refs:
      - argos-validation/harness/reporters/evidence_panel.py
      - argos-validation/harness/checkpoints.py
      - argos-validation/evaluators/resilience/__init__.py
    gate_id: G6
    status: PARTIAL
    notes: >
      ARG-024 (F09 adversarial + regresión) construido y probado.
      ARG-026 (evidence store/dashboards/paquete firmado, P1 pero
      confirmado prioritario) ya tiene su slice P0 real: el evidence
      manifest (harness/evidence/manifest.py) y el panel operativo mínimo
      (harness/reporters/evidence_panel.py). ARG-023 (integración
      CP00-CP13 y trazabilidad end-to-end) ya tiene un validador real
      (harness/checkpoints.py) que exige un único run_id coherente en
      todos los checkpoints con contrato v1 — probado contra un sample-run
      real: 11/14 checkpoints validan end-to-end con run_id=run-smoke-001
      compartido (CP02/03/06/07/08/09/10/11/13 desde fixtures/smoke/, más
      CP04/CP05 generados invocando el código REAL de producción —
      argos-core.services.risk_engine.rank_findings y
      argos-cyber-tools.graph.attack_path.validate_attack_path contra
      Gateway.authorize() real — ninguno necesita cluster). Gap real que
      SIGUE abierto, no oculto: CP00 (reset con hash verificable), CP01
      (inyección de workload) y CP12 (verificación post-contención)
      exigen un cyber-range realmente desplegado que no existe todavía
      (mismo bloqueo que ENV-QUAL-01) — el propio sample-run los deja
      ausentes a propósito para que el validador los reporte como
      faltantes, no como resuelto.
      ARG-025 ("backup/restore, retry, interrupción e idempotencia") se
      divide en dos partes con estados muy distintos, no debe tratarse
      como un bloque monolítico: la mitad "retry/interrupción/
      idempotencia" SÍ está cubierta de verdad — mismo mecanismo que
      AC13/ARG-021 (IdempotencyStore real en argos-cyber-tools,
      test_executor_idempotency.py, evaluators/resilience con tolerancia
      cero). La mitad "backup/restore de OpenSearch/Ceph RGW" sigue sin
      NINGÚN script en argos-platform, y a diferencia de otros gaps de
      esta lista NO es solo "falta escribirlo": Ceph RGW no tiene ni
      siquiera decidido si se despliega como Rook-Ceph self-hosted o como
      servicio S3 gestionado de OSC (DEP-02, ver
      argos-platform/platform/ceph-rgw/README.md) y OpenSearch sigue
      `enabled: false` en helm/argos-services/values.yaml con versión de
      chart "TODO". Escribir un script de backup/restore hoy exigiría
      inventar contra qué endpoint/API opera — se deja correctamente
      BLOCKED hasta que DEP-02 se resuelva y ENV-QUAL-01 provea un
      cluster real, mismo principio que ENV-QUAL-01/CAP-01 en la propia
      propuesta v0.6.25.4 (§3.1/§3.3: no fabricar contra infraestructura
      que no existe). G6 no puede declararse PASS con este gap abierto.

  - uc_id: G7
    sprint: S8
    objective: "Acceptance Gate: AC01-AC14, ARR, as-built, runbooks, evidence pack y PI3"
    story_ids: [ARG-027, ARG-028]
    contract_ids: [evidence-manifest.v1, soc-handover.v1]
    test_ids:
      - argos-validation/tests/test_evidence_manifest.py
      - argos-validation/tests/test_report_schema.py
      - argos-validation/tests/test_run_summary.py
      - argos-validation/tests/test_acceptance.py
      - argos-validation/harness/acceptance.py
    metric_ids:
      - trace_completeness  # AC14
    evidence_refs:
      - argos-control/project/acceptance/acceptance-criteria.yaml
      - argos-validation/harness/acceptance.py
    gate_id: G7
    status: BLOCKED
    notes: >
      ARG-027 ("Acceptance runner AC01-AC14, ARR/G7...", redacción
      corregida en backlog.yaml para coincidir con el documento vigente)
      ya tiene su pieza de código real: harness/acceptance.py corre las 7
      suites registradas contra thresholds/acceptance.yaml, agrega por AC
      (peor gate entre suites que contribuyen), EXIGE cobertura completa
      de los 14 AC (así se descubrieron y cerraron los gaps de
      AC01/AC02/AC10/AC12 — ver G2/G5 arriba) y sella el resultado con
      sha256 (hash-seal, no firma criptográfica con clave real — no
      existe PKI todavía, documentado explícitamente como tal). Corrido
      hoy: cobertura completa de los 14 AC, pero overall=FAIL real
      (AC03/AC08 fallan contra el umbral de aceptación porque solo hay
      datos smoke-tier, no acceptance-tier calibrados) — el runner
      reporta eso tal cual, no lo suaviza. Sigue faltando: as-built,
      runbooks rellenados (solo
      argos-control/templates/runbook/runbook-template.md, una plantilla
      vacía) y el evidence pack end-to-end de ARG-028. Depende de G6, que
      también está PARTIAL — G7 se queda correctamente BLOCKED, no se
      fuerza un PASS prematuro.
