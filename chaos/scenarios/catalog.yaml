# Catálogo de escenarios de Chaos Engineering (ADR-068, argos-control).
# Cada entrada declara los campos obligatorios que exige
# chaos.ChaosSafetyGuard.authorize (experiment_id, hypothesis, target,
# expected_steady_state, blast_radius, duration_seconds, abort_conditions,
# recovery_procedure) más metadatos de catálogo (category, component,
# quality_gates, status). NINGÚN escenario de aquí se ha ejecutado contra
# un clúster real todavía -- status=DESIGNED para todos salvo los que ya
# tienen una regresión local ejecutable sin clúster (ver status=TESTED_LOCALLY
# y su test_ref). No confundir con VALIDATED_IN_TARGET (requiere clúster
# real, BLOCKED_EXTERNAL hoy, mismo bloqueo que ARG-021/Shuffle).

schema_version: 1
adr_ref: ADR-068

scenarios:
  - experiment_id: CHAOS-01
    category: control-plane
    component: argos-core
    hypothesis: "Un pod de argos-core puede matarse sin corrupción de estado ni pérdida de eventos en vuelo"
    target: "deployment/argos-core"
    expected_steady_state: "El pipeline normalizer->correlator sigue produciendo Incident v1 dentro de 30s tras el kill"
    blast_radius: "1 pod, namespace argos-cyber-range"
    duration_seconds: 60
    abort_conditions: ["error_rate>0.5", "manual_abort"]
    recovery_procedure: "kubectl rollout restart deployment/argos-core"
    quality_gates: [CH-05, CH-06]
    status: DESIGNED

  - experiment_id: CHAOS-02
    category: control-plane
    component: correlator
    hypothesis: "El correlador se reanuda sin duplicar Incident tras un kill a mitad de agrupación"
    target: "deployment/argos-core (proceso correlator)"
    expected_steady_state: "Ningún Incident duplicado (mismo member_event_ids) tras la reanudación"
    blast_radius: "1 pod, namespace argos-cyber-range"
    duration_seconds: 60
    abort_conditions: ["duplicate_incident_detected", "manual_abort"]
    recovery_procedure: "kubectl rollout restart deployment/argos-core"
    quality_gates: [CH-06]
    status: DESIGNED

  - experiment_id: CHAOS-03
    category: sensor-loss
    component: wazuh
    hypothesis: "La caída de Wazuh se refleja como degradación explícita, nunca como telemetría inventada"
    target: "statefulset/wazuh-manager (namespace argos-xdr)"
    expected_steady_state: "ARGOS reporta sensor_status=DEGRADED, cero SecurityEvent fabricados"
    blast_radius: "1 componente, namespace argos-xdr"
    duration_seconds: 120
    abort_conditions: ["fabricated_event_detected", "manual_abort"]
    recovery_procedure: "kubectl rollout restart statefulset/wazuh-manager"
    quality_gates: [CH-11]
    status: DESIGNED

  - experiment_id: CHAOS-04
    category: sensor-loss
    component: falco
    hypothesis: "La caída de Falco es visible como pérdida de sensor, no como silencio indistinguible de 'sin actividad'"
    target: "daemonset/falco"
    expected_steady_state: "sensor_status=DEGRADED visible en dashboard/alerting, no falso negativo silencioso"
    blast_radius: "N pods (daemonset), namespace kube-system"
    duration_seconds: 120
    abort_conditions: ["manual_abort"]
    recovery_procedure: "kubectl rollout restart daemonset/falco"
    quality_gates: [CH-11]
    status: DESIGNED

  - experiment_id: CHAOS-05
    category: bus
    component: nats
    hypothesis: "La caída de NATS activa retry/backpressure sin pérdida silenciosa de mensajes"
    target: "statefulset/nats (namespace argos-observability)"
    expected_steady_state: "Ningún mensaje se pierde sin quedar registrado como reintento fallido"
    blast_radius: "1 componente, namespace argos-observability"
    duration_seconds: 90
    abort_conditions: ["silent_message_loss", "manual_abort"]
    recovery_procedure: "kubectl rollout restart statefulset/nats"
    quality_gates: [CH-08]
    status: DESIGNED

  - experiment_id: CHAOS-06
    category: bus
    component: nats
    hypothesis: "La latencia inyectada en NATS respeta el SLO con timeout seguro, no bloqueo indefinido"
    target: "statefulset/nats (namespace argos-observability)"
    expected_steady_state: "P99 dentro del SLO declarado o timeout explícito, nunca cuelgue indefinido"
    blast_radius: "1 componente, namespace argos-observability"
    duration_seconds: 90
    abort_conditions: ["indefinite_hang", "manual_abort"]
    recovery_procedure: "eliminar NetworkChaos (latencia)"
    quality_gates: [CH-05]
    status: DESIGNED

  - experiment_id: CHAOS-07
    category: network
    component: cyber-range
    hypothesis: "Una partición de red se detecta como componente aislado, no como fallo ambiguo"
    target: "namespace argos-cyber-range (NetworkChaos partition)"
    expected_steady_state: "ARGOS marca explícitamente el componente aislado, no lo trata como sano"
    blast_radius: "1 namespace, argos-cyber-range"
    duration_seconds: 120
    abort_conditions: ["ambiguous_health_reported", "manual_abort"]
    recovery_procedure: "eliminar NetworkChaos (partition)"
    quality_gates: [CH-11]
    status: DESIGNED

  - experiment_id: CHAOS-08
