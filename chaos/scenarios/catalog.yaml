  - experiment_id: CHAOS-16
    category: safety-chain
    component: mcp-gateway
    hypothesis: "Un reinicio del MCP Gateway a mitad de flujo no permite reutilización cross-incident (R0-01/R0-01-RESIDUAL); por separado, se comprueba si tampoco permite replay de una Approval ya consumida"
    target: "mcp_gateway.Gateway (argos-cyber-tools)"
    expected_steady_state: "Envelope A + Approval A + contexto de Incident B sigue siendo DENY tras el reinicio, executor_call_count=0"
    blast_radius: "1 proceso, argos-cyber-tools"
    duration_seconds: 30
    abort_conditions: ["cross_incident_reuse_accepted", "manual_abort"]
    recovery_procedure: "reiniciar proceso mcp_gateway (recrea Gateway/ApprovalStore)"
    quality_gates: [CH-04, CH-07]
    status: TESTED_LOCALLY
    test_ref: "argos-cyber-tools/tests/adversarial/test_chaos_16_gateway_restart_r0_01_regression.py"
    notes: >-
      Resultado real, no supuesto: CH-04 (cross-incident) = PASS, sobrevive
      al reinicio. CH-07 (replay de Approval ya consumida) = KNOWN_FAILING,
      confirmado con un test xfail intencional -- gap real de ARG-020
      (ApprovalStore en memoria de proceso, sin almacén compartido), no una
      regresión de R0-01/R0-01-RESIDUAL. Ver ADR-068.

  - experiment_id: CHAOS-17
