    blast_radius: "1 componente, namespace argos-evidence"
    duration_seconds: 60
    abort_conditions: ["silent_log_failure", "manual_abort"]
    recovery_procedure: "kubectl rollout restart deployment/argos-core"
    quality_gates: [CH-08]
