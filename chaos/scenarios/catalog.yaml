    hypothesis: "50 eventos Falco de subproceso con la misma correlation_key, más un reinicio del correlador a mitad de la ventana, siguen produciendo 1 único Incident -- ni 50, ni una fusión incorrecta de dos ataques distintos"
    target: "correlator.dedupe_by_correlation_key (argos-core)"
    expected_steady_state: "1 Incident con occurrence_count=50 y evidence_refs completo, tras reanudar desde cualquier punto de la secuencia"
    blast_radius: "1 proceso, argos-core"
    duration_seconds: 30
    abort_conditions: ["incident_count_not_equal_1", "cross_attack_merge_detected", "manual_abort"]
    recovery_procedure: "reiniciar proceso correlator -- dedupe_by_correlation_key es sin estado entre invocaciones, no requiere recuperación de estado"
    quality_gates: [CH-06, CH-08]
    status: TESTED_LOCALLY
    test_ref: "argos-core/tests/unit/test_correlator.py::test_chaos_20_dedup_survives_restart_mid_sequence"

  # ---------------------------------------------------------------------
  # CHAOS-21..32: extensión del catálogo (ADR-069, Detection Engineering
  # Loop) -- Kafka, OpenSearch, Investigator, generación de reglas Wazuh,
  # backtesting y el bucle de feedback SOC.
  # ---------------------------------------------------------------------

  - experiment_id: CHAOS-21
    category: bus
    component: kafka
    hypothesis: "Kafka no disponible degrada explícitamente el bucle de investigación sin perder eventos ya persistidos en Wazuh"
    target: "statefulset/kafka (namespace argos-kafka)"
    expected_steady_state: "Ningún WeakSignal se pierde de forma silenciosa -- Wazuh sigue escribiendo a OpenSearch (flujo soportado, ADR-069) pese a la caída de Kafka"
    blast_radius: "1 componente, namespace argos-kafka"
    duration_seconds: 120
    abort_conditions: ["silent_signal_loss", "manual_abort"]
    recovery_procedure: "kubectl rollout restart statefulset/kafka"
    quality_gates: [CH-08, CH-11]
    status: DESIGNED

  - experiment_id: CHAOS-22
    category: bus
    component: kafka
    hypothesis: "Una entrega duplicada de Kafka con el mismo event_id produce 1 sola investigación, no N"
    target: "argos.investigation.trigger.v1 (topic)"
    expected_steady_state: "investigation_id es idempotente por event_id -- redelivery no crea una segunda GlobalInvestigationRequest"
    blast_radius: "1 proceso, argos-investigator"
    duration_seconds: 30
    abort_conditions: ["duplicate_investigation_created", "manual_abort"]
    recovery_procedure: "n/a -- redelivery es simulada, no requiere recuperación de infraestructura"
    quality_gates: [CH-06]
    status: DESIGNED

