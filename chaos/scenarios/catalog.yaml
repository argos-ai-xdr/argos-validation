    component: kubernetes-executor
    hypothesis: "Un executor que cae justo después de execute permite verify/rollback/recovery, no un estado indefinido"
    target: "executors.KubernetesExecutor (argos-cyber-tools)"
    expected_steady_state: "Estado final es CONSISTENTE (rollback aplicado o verify confirma el cambio), nunca ambiguo"
    blast_radius: "1 proceso, argos-cyber-tools"
    duration_seconds: 30
    abort_conditions: ["indeterminate_final_state", "manual_abort"]
    recovery_procedure: "rollback_isolate_kubernetes_workload (executors/rollback)"
    quality_gates: [CH-06]
    status: DESIGNED

