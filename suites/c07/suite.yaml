# C-07: exposición, RBAC y ruta de ataque controlada.
# Sin contrato dedicado a "grafo RBAC"/"attack path" en argos-contracts-scenarios
# todavía (F04/F05 son fixtures narrativos, no JSON Schema); este suite evalúa
# lo que sí es un contrato real: que las PolicyDecision del escenario respetan
# la allowlist del cyber-range (condición de entrada de C-07, gate G3).
id: c07
mode: golden
checks:
  - evaluator: evaluators.tool_calls
    contract: policy-decision
    category: smoke
    metric_name: tool_correctness
    extra:
      # Coincide con el target real de fixtures/smoke/policy-decision/
      # (deployment/gseg-simulado) — ver la nota de limitación en
      # evaluators/tool_calls/__init__.py sobre granularidad target vs namespace.
      target_allowlist: ["deployment/gseg-simulado"]
