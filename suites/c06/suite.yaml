# C-06: inventario, vulnerabilidades y priorización.
id: c06
mode: golden
checks:
  - evaluator: evaluators.hallucination
    contract: vulnerability-finding
    category: smoke
    metric_name: ungrounded_cve_rate
  - evaluator: evaluators.prioritization
    contract: vulnerability-finding
    category: smoke
    metric_name: prioritization_evidence_completeness
  - evaluator: evaluators.traceability
    contract: asset-snapshot
    category: smoke
    metric_name: trace_completeness
  - evaluator: evaluators.drift
    contract: asset-snapshot
    category: smoke
    metric_name: critical_drift_missed_rate
  - evaluator: evaluators.inventory_coverage
    contract: asset-snapshot
    category: smoke
    metric_name: asset_coverage
    extra:
      # Duplica ground-truth/manifests/argos-cyb-01.yaml a propósito — el
      # runner no resuelve todavía referencias a ground-truth/ dentro de
      # `extra` (mismo patrón/limitación ya documentado en
      # suites/argos-cyb-01/suite.yaml para expected_event_ids).
      expected_assets:
        - {asset_id: asset-gseg-01, criticality_esp: high}
